<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S2 Fitness Scratch Card</title>

<style>

body{
margin:0;
background:#000;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}

.card{
position:relative;
width:350px;
height:500px;
border-radius:20px;
overflow:hidden;
background:#111;
border:3px solid gold;
}

.reward{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
text-align:center;
}

.reward h1{
font-size:55px;
color:gold;
margin:0;
}

.reward p{
font-size:22px;
}

canvas{
position:absolute;
top:0;
left:0;
}

</style>
</head>

<body>
    
<div style="position:absolute;top:20px;color:white;text-align:center;width:100%;z-index:999;">

<input
type="text"
id="phoneNumber"
placeholder="+91XXXXXXXXXX"
style="padding:10px;border-radius:10px;border:none;width:250px;"
>

<br><br>

<button onclick="sendOTP()"
style="padding:10px 20px;border:none;border-radius:10px;background:gold;font-weight:bold;">

Send OTP

</button>

<br><br>

<input
type="text"
id="otpCode"
placeholder="Enter OTP"
style="padding:10px;border-radius:10px;border:none;width:250px;"
>

<br><br>

<button onclick="verifyOTP()"
style="padding:10px 20px;border:none;border-radius:10px;background:gold;font-weight:bold;">

Verify & Scratch

</button>

<div id="recaptcha-container"></div>

</div>
<div class="card">

<div class="reward">
<h1 id="rewardText"></h1>
<p>S2 Fitness Club</p>
<p>One Hour Can Change Your Life</p>
</div>

<canvas id="scratch"></canvas>

</div>

<script>

const canvas = document.getElementById("scratch");
const ctx = canvas.getContext("2d");

canvas.width = 350;
canvas.height = 500;

ctx.fillStyle = "silver";
ctx.fillRect(0,0,350,500);

ctx.fillStyle = "black";
ctx.font = "30px Arial";
ctx.fillText("SCRATCH HERE",60,250);
const rewards = [

"2 MONTH FREE",
"2 MONTH FREE",
"2 MONTH FREE",
"2 MONTH FREE",
"2 MONTH FREE",

"3 MONTH FREE",
"3 MONTH FREE",
"3 MONTH FREE",

"4 MONTH FREE",
"4 MONTH FREE",

"6 MONTH FREE"

];

const randomReward =
rewards[Math.floor(Math.random() * rewards.length)];

let savedReward = localStorage.getItem("gymReward");

if(!savedReward){

savedReward =
rewards[Math.floor(Math.random() * rewards.length)];

localStorage.setItem("gymReward", savedReward);

}

document.getElementById("rewardText").innerText = savedReward;
let isDrawing = false;
canvas.addEventListener("mousedown", () => {
isDrawing = true;
});

canvas.addEventListener("mouseup", () => {
isDrawing = false;
});

canvas.addEventListener("mousemove", (e) => {

if(!isDrawing) return;

const rect = canvas.getBoundingClientRect();

const x = e.clientX - rect.left;
const y = e.clientY - rect.top;

ctx.globalCompositeOperation = "destination-out";

ctx.beginPath();
ctx.arc(x, y, 25, 0, Math.PI * 2);

ctx.fill();

});
window.recaptchaVerifier =
new RecaptchaVerifier(auth,
'recaptcha-container',
{
size:'normal'
});

window.sendOTP = async function(){

const phoneNumber =
document.getElementById("phoneNumber").value;

const appVerifier =
window.recaptchaVerifier;

window.confirmationResult =
await signInWithPhoneNumber(
auth,
phoneNumber,
appVerifier
);

alert("OTP Sent");

}

window.verifyOTP = async function(){

const code =
document.getElementById("otpCode").value;

await window.confirmationResult.confirm(code);

alert("Verified Successfully");

}
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyDwf82MX79Ymh1_6tJGDa1VM-X5mEKM7kg",

authDomain: "s2-fitness-scratchcard.firebaseapp.com",

projectId: "s2-fitness-scratchcard",

storageBucket: "s2-fitness-scratchcard.firebasestorage.app",

messagingSenderId: "737078362451",

appId: "1:737078362451:web:77e2b0878e3fe84f0461a6"

};

const app = initializeApp(firebaseConfig);
import {
getAuth,
RecaptchaVerifier,
signInWithPhoneNumber
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const auth = getAuth(app);
const db = getFirestore(app);

async function loadReward(){

const querySnapshot =
await getDocs(collection(db, "scratchCards"));

let available = [];

querySnapshot.forEach((docSnap)=>{

if(docSnap.data().used == false){

available.push({
id: docSnap.id,
reward: docSnap.data().reward
});

}

});

if(available.length == 0){

document.getElementById("rewardText").innerText =
"NO REWARDS LEFT";

return;

}

const selected =
available[Math.floor(Math.random()*available.length)];

document.getElementById("rewardText").innerText =
selected.reward;

await updateDoc(doc(db,"scratchCards",selected.id),{

used:true

});

}

loadReward();

</script>
</body>
</html>
