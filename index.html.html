<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S2 Fitness Scratch Card</title>

<style>
body{
margin:0;
background:#000;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}

.card{
position:relative;
width:350px;
height:500px;
border-radius:20px;
overflow:hidden;
background:#111;
border:3px solid gold;
}

.reward{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
text-align:center;
}

.reward h1{
font-size:40px;
color:gold;
margin:0;
}

.reward p{
font-size:20px;
}

canvas{
position:absolute;
top:0;
left:0;
}

.topbox{
position:absolute;
top:20px;
width:100%;
text-align:center;
z-index:999;
}

input{
padding:10px;
border:none;
border-radius:10px;
width:250px;
margin-bottom:10px;
}

button{
padding:10px 20px;
border:none;
border-radius:10px;
background:gold;
font-weight:bold;
cursor:pointer;
margin-bottom:10px;
}
</style>
</head>

<body>

<div class="topbox">

<input
type="text"
id="phoneNumber"
placeholder="+91XXXXXXXXXX"
>

<br>

<button id="sendBtn">
Send OTP
</button>

<br>

<input
type="text"
id="otpCode"
placeholder="Enter OTP"
>

<br>

<button id="verifyBtn">
Verify & Scratch
</button>

<div id="recaptcha-container"></div>

</div>

<div class="card">

<div class="reward">
<h1 id="rewardText">SCRATCH CARD</h1>
<p>S2 Fitness Club</p>
<p>One Hour Can Change Your Life</p>
</div>

<canvas id="scratch"></canvas>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
RecaptchaVerifier,
signInWithPhoneNumber
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey: "AIzaSyDwf82MX79Ymh1_6tJGDa1VM-X5mEKM7kg",
authDomain: "s2-fitness-scratchcard.firebaseapp.com",
projectId: "s2-fitness-scratchcard",
storageBucket: "s2-fitness-scratchcard.firebasestorage.app",
messagingSenderId: "737078362451",
appId: "1:737078362451:web:77e2b0878e3fe84f0461a6"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

window.recaptchaVerifier = new RecaptchaVerifier(
auth,
"recaptcha-container",
{
size: "normal"
}
);

let verified = false;

document.getElementById("sendBtn").addEventListener("click", async ()=>{

try{

const phoneNumber =
document.getElementById("phoneNumber").value;

const appVerifier = window.recaptchaVerifier;

window.confirmationResult =
await signInWithPhoneNumber(
auth,
phoneNumber,
appVerifier
);

alert("OTP Sent");

}catch(error){

alert(error.message);

}

});

document.getElementById("verifyBtn").addEventListener("click", async ()=>{

try{

const code =
document.getElementById("otpCode").value;

await window.confirmationResult.confirm(code);

verified = true;

alert("Verified Successfully");

}catch(error){

alert(error.message);

}

});

const canvas = document.getElementById("scratch");
const ctx = canvas.getContext("2d");

canvas.width = 350;
canvas.height = 500;

ctx.fillStyle = "silver";
ctx.fillRect(0,0,350,500);

ctx.fillStyle = "black";
ctx.font = "30px Arial";
ctx.fillText("SCRATCH HERE",60,250);

let selectedId = null;

async function loadReward(){

const querySnapshot =
await getDocs(collection(db, "scratchCards"));

let available = [];

querySnapshot.forEach((docSnap)=>{

if(docSnap.data().used == false){

available.push({
id: docSnap.id,
reward: docSnap.data().reward
});

}

});

if(available.length == 0){

document.getElementById("rewardText").innerText =
"NO REWARDS LEFT";

return;

}

const selected =
available[Math.floor(Math.random()*available.length)];

selectedId = selected.id;

document.getElementById("rewardText").innerText =
selected.reward;

}

loadReward();

let isDrawing = false;

canvas.addEventListener("mousedown", () => {

if(!verified){

alert("Please Verify OTP First");
return;

}

isDrawing = true;

});

canvas.addEventListener("mouseup", async () => {

isDrawing = false;

if(selectedId){

await updateDoc(doc(db,"scratchCards",selectedId),{
used:true
});

}

});

canvas.addEventListener("mousemove", (e) => {

if(!isDrawing) return;

const rect = canvas.getBoundingClientRect();

const x = e.clientX - rect.left;
const y = e.clientY - rect.top;

ctx.globalCompositeOperation = "destination-out";

ctx.beginPath();
ctx.arc(x, y, 25, 0, Math.PI * 2);

ctx.fill();

});

</script>

</body>
</html>
